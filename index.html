<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>打開 Obsidian 筆記</title>
<style>
  body { font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f6f5f2; color: #222; }
  main { text-align: center; padding: 24px; max-width: 420px; }
  a.btn { display: inline-block; margin-top: 16px; padding: 14px 22px; background: #7c3aed; color: #fff; border-radius: 12px; text-decoration: none; font-size: 17px; }
  p.name { word-break: break-all; color: #555; }
</style>
</head>
<body>
<main>
  <p id="msg">正在打開 Obsidian…</p>
  <p class="name" id="name"></p>
  <a class="btn" id="go" href="#">沒自動打開？點這裡</a>
</main>
<script>
  // 用法：https://<這個網址>/#vault=<URL編碼的庫名>&file=<URL編碼的相對路徑，不含 .md>
  // # 後面的內容不會送到伺服器，只在你的裝置上組成 obsidian://open 連結。這個頁面本身不含任何筆記資料。
  var h = location.hash.slice(1);
  var go = document.getElementById('go');
  var params = {};
  h.split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) params[kv.slice(0, i)] = kv.slice(i + 1); });
  if (!params.vault || !params.file) {
    document.getElementById('msg').textContent = '這個連結沒有帶筆記路徑。';
    go.style.display = 'none';
  } else {
    var url = 'obsidian://open?vault=' + params.vault + '&file=' + params.file;
    try { document.getElementById('name').textContent = decodeURIComponent(params.file); } catch (e) {}
    go.href = url;
    location.href = url;
  }
</script>
</body>
</html>
