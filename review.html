<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>審稿</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f1f5f9);
    --text: var(--tg-theme-text-color, #1f2937);
    --hint: var(--tg-theme-hint-color, #6b7280);
    --accent: var(--tg-theme-button-color, #6366f1);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--text) 10%, transparent);
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 17px/1.55 -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  main { padding: 14px 12px 110px; max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 4px 2px; }
  .tip { color: var(--hint); font-size: 14px; margin: 0 4px 12px; }
  .s { background: var(--bg); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; border: 2px solid transparent; box-shadow: 0 1px 3px rgba(0,0,0,.06); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .s.bad { border-color: var(--warn); }
  .n { display: inline-block; min-width: 26px; font-size: 13px; color: var(--hint); }
  .zh { font-size: 17px; }
  .en { color: var(--hint); font-size: 14px; margin-top: 2px; }
  .flag { float: right; font-size: 13px; color: var(--hint); }
  .s.bad .flag { color: var(--warn); font-weight: 700; }
  textarea { display: none; width: 100%; margin-top: 8px; font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); resize: vertical; min-height: 44px; }
  .s.bad textarea { display: block; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .bar button { flex: 1; font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 12px; background: var(--accent); color: var(--accent-text); }
  #out { display: none; white-space: pre-wrap; background: var(--bg); border-radius: 12px; padding: 12px; margin-top: 12px; font-size: 15px; user-select: all; -webkit-user-select: all; }
  .toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); background: rgba(0,0,0,.8); color: #fff; padding: 14px 18px; border-radius: 12px; font-size: 16px; display: none; text-align: center; }
  .err { color: var(--hint); text-align: center; padding: 40px 10px; }
</style>
</head>
<body>
<main id="app"><div class="err">載入中…</div></main>
<div class="bar" id="bar" style="display:none"><button id="send">複製結果，回對話貼上</button></div>
<div class="toast" id="toast"></div>
<script>
// 蠻尼的互動審稿頁（2026-11-28 第三批 #17）：口白逐句列出，點一句＝標「要改」，可寫原因；按下面按鈕把結果複製起來，回 TG 對話貼給蠻尼。
// 為什麼用複製：官方 TG 外掛收不到 Mini App 的 sendData（只處理文字、照片、語音等），所以改成一段文字讓 Judy 貼回。
// 稿子內容放在網址 # 後面（deflate-raw 壓縮 base64url 的 JSON {t:標題, l:[[段,中文,英文],…]}），不會送到伺服器、不存在 GitHub。
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
async function load() {
  const h = new URLSearchParams(location.hash.slice(1));
  const z = h.get('z');
  if (!z) throw new Error('沒有稿子內容');
  const b64 = z.replace(/-/g, '+').replace(/_/g, '/');
  const bytes = Uint8Array.from(atob(b64 + '='.repeat((4 - b64.length % 4) % 4)), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return JSON.parse(await new Response(stream).text());
}
function toast(msg, ms = 1600) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', ms); }
function result(d) {
  const bad = [...document.querySelectorAll('.s.bad')];
  if (!bad.length) return `📝 審稿回覆：${d.t}\n全部 OK`;
  return `📝 審稿回覆：${d.t}\n` + bad.map(el => {
    const i = Number(el.dataset.i), r = d.l[i], note = el.querySelector('textarea').value.trim();
    return `第${r[0]}段 要改：${note || '（沒寫原因）'}\n  原句：${r[1]}`;
  }).join('\n');
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch {} ta.remove(); return ok;
}
load().then(d => {
  document.title = `審稿：${d.t}`;
  const app = document.getElementById('app');
  app.innerHTML = `<h1>${esc(d.t)}</h1><p class="tip">點一句＝標「要改」，可以寫原因；再點一次取消。沒標的就是 OK。</p>` +
    d.l.map((r, i) => `<div class="s" data-i="${i}"><span class="flag">點我標要改</span><span class="n">${esc(r[0])}</span><span class="zh">${esc(r[1])}</span>${r[2] ? `<div class="en">${esc(r[2])}</div>` : ''}<textarea placeholder="哪裡要改？（可以不寫）"></textarea></div>`).join('') +
    `<div id="out"></div>`;
  app.addEventListener('click', e => {
    if (e.target.tagName === 'TEXTAREA') return;
    const s = e.target.closest('.s'); if (!s) return;
    s.classList.toggle('bad');
    s.querySelector('.flag').textContent = s.classList.contains('bad') ? '要改' : '點我標要改';
    if (s.classList.contains('bad')) s.querySelector('textarea').focus();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  });
  document.getElementById('bar').style.display = 'flex';
  document.getElementById('send').onclick = async () => {
    const text = result(d);
    const out = document.getElementById('out'); out.textContent = text; out.style.display = 'block';
    if (await copy(text)) { toast('已複製 回對話長按貼上送出'); if (tg) setTimeout(() => tg.close(), 1700); }
    else { toast('沒辦法自動複製，請長按下面那段全選複製', 2500); out.scrollIntoView({ behavior: 'smooth' }); }
  };
}).catch(e => { document.getElementById('app').innerHTML = `<div class="err">打不開：${esc(e.message)}</div>`; });
</script>
</body>
</html>
